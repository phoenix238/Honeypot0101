<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment details</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --linen:oklch(0.966 0.013 83);--card:oklch(0.995 0.005 88);--ink:oklch(0.3 0.02 60);
  --muted:oklch(0.55 0.03 55);--faint:oklch(0.62 0.02 60);
  --clay:oklch(0.58 0.115 42);--clay-text:oklch(0.42 0.1 42);--clay-tint:oklch(0.94 0.03 48);
  --sage:oklch(0.62 0.13 148);--sage-text:oklch(0.42 0.08 148);--sage-tint:oklch(0.94 0.03 148);
  --amber-text:oklch(0.5 0.09 75);--amber-tint:oklch(0.95 0.035 85);
  --line:oklch(0.91 0.015 80);--inputbg:oklch(0.975 0.01 84);--inputline:oklch(0.89 0.015 80);
}
body{background:var(--linen);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px 26px;width:100%;max-width:420px;
  box-shadow:0 1px 2px oklch(0.4 0.03 60 / .05),0 8px 24px oklch(0.4 0.03 60 / .05)}
.to{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.name{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;font-size:21px;font-weight:600;margin-bottom:18px;color:var(--ink)}
.amt{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;font-size:42px;font-weight:600;color:var(--clay-text);letter-spacing:-.01em;margin-bottom:22px}
.lbl{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--inputbg);border:1px solid var(--inputline);
  border-radius:12px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:inherit;font:inherit;transition:border-color .15s,background-color .15s}
.row:active{border-color:var(--clay)}
.row.done{border-color:var(--sage);background:var(--sage-tint)}
.val{flex:1;min-width:0;font-size:15px;font-weight:600;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.cp{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.row.done .cp{color:var(--sage-text)}
.warn{font-size:13px;color:var(--amber-text);background:var(--amber-tint);border-radius:12px;padding:16px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// Everything arrives in the URL fragment, which browsers never send to the server —
// these details stay on the two phones involved.
var p = new URLSearchParams(location.hash.slice(1));
var name = p.get('n') || '', bank = p.get('b') || '', amt = p.get('a') || '', ref = p.get('r') || '';
var sortCode = p.get('sc') || '', acctNum = p.get('an') || '';
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

var card = document.getElementById('card');
if (!bank && !sortCode && !acctNum && !amt && !ref) {
  card.innerHTML = '<div class="warn">This link has no payment details in it.<br>Ask for a new one.</div>';
} else {
  var html = '';
  if (name) html += '<div class="to">Pay</div><div class="name">' + esc(name) + '</div>';
  if (amt) html += '<div class="amt">£' + esc(amt) + '</div>';
  var rows = [];
  // Each line copies on its own — banking apps have separate sort code / account
  // number fields, so a single combined line has to be retyped or split by hand.
  if (sortCode || acctNum) {
    if (sortCode) rows.push(['Sort code', sortCode]);
    if (acctNum) rows.push(['Account number', acctNum]);
  } else if (bank) {
    rows.push(['Bank details', bank]);
  }
  if (ref) rows.push(['Reference — please include this', ref]);
  rows.forEach(function (r, i) {
    html += '<div class="lbl">' + esc(r[0]) + '</div>' +
      '<button class="row" data-v="' + esc(r[1]) + '"><span class="val">' + esc(r[1]) +
      '</span><span class="cp">Copy</span></button>';
  });
  card.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.row'), function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-v'), done = function () {
        b.classList.add('done'); b.querySelector('.cp').textContent = 'Copied';
        setTimeout(function () { b.classList.remove('done'); b.querySelector('.cp').textContent = 'Copy'; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(v).then(done, function () {});
      } else {
        var t = document.createElement('textarea');
        t.value = v; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(t);
      }
    });
  });
}
</script>
</body>
</html>
