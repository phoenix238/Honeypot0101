<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment details</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#16140F;color:#F2EEE3;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#211E17;border:1px solid #322D23;border-radius:20px;padding:26px 22px 24px;width:100%;max-width:420px}
.to{font-size:12px;color:#8A8576;margin-bottom:4px}
.name{font-size:19px;font-weight:700;margin-bottom:18px}
.amt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:40px;font-weight:700;color:#E0A92E;letter-spacing:-.02em;margin-bottom:20px}
.lbl{font-size:10px;color:#5C574B;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#16140F;border:1px solid #322D23;
  border-radius:12px;padding:11px 14px;margin-bottom:9px;cursor:pointer;color:inherit;font:inherit;transition:border-color .15s}
.row:active{border-color:#E0A92E}
.row.done{border-color:#5BBF8A}
.val{flex:1;min-width:0;font-size:15px;font-weight:700;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cp{font-size:11px;font-weight:700;color:#8A8576;flex-shrink:0}
.row.done .cp{color:#5BBF8A}
.note{font-size:12px;color:#8A8576;line-height:1.6;margin-top:16px;text-align:center}
.warn{font-size:13px;color:#E0A92E;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// Everything arrives in the URL fragment, which browsers never send to the server —
// these details stay on the two phones involved.
var p = new URLSearchParams(location.hash.slice(1));
var name = p.get('n') || '', bank = p.get('b') || '', amt = p.get('a') || '', ref = p.get('r') || '';
var sortCode = p.get('sc') || '', acctNum = p.get('an') || '';
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

var card = document.getElementById('card');
if (!bank && !sortCode && !acctNum && !amt && !ref) {
  card.innerHTML = '<div class="warn">This link has no payment details in it.<br>Ask for a new one.</div>';
} else {
  var html = '';
  if (name) html += '<div class="to">Pay</div><div class="name">' + esc(name) + '</div>';
  if (amt) html += '<div class="amt">£' + esc(amt) + '</div>';
  var rows = [];
  // Each line copies on its own — banking apps have separate sort code / account
  // number fields, so a single combined line has to be retyped or split by hand.
  if (sortCode || acctNum) {
    if (sortCode) rows.push(['Sort code', sortCode]);
    if (acctNum) rows.push(['Account number', acctNum]);
  } else if (bank) {
    rows.push(['Bank details', bank]);
  }
  if (ref) rows.push(['Reference — please include this', ref]);
  rows.forEach(function (r, i) {
    html += '<div class="lbl">' + esc(r[0]) + '</div>' +
      '<button class="row" data-v="' + esc(r[1]) + '"><span class="val">' + esc(r[1]) +
      '</span><span class="cp">Copy</span></button>';
  });
  html += '<div class="note">Open your banking app and make a transfer to these details. ' +
    'Tap any line above to copy it.</div>';
  card.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.row'), function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-v'), done = function () {
        b.classList.add('done'); b.querySelector('.cp').textContent = 'Copied';
        setTimeout(function () { b.classList.remove('done'); b.querySelector('.cp').textContent = 'Copy'; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(v).then(done, function () {});
      } else {
        var t = document.createElement('textarea');
        t.value = v; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(t);
      }
    });
  });
}
</script>
</body>
</html>
